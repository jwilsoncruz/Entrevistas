<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turnos de entrevistas SUD</title>
<style>
:root{--bg:#f4f7fa;--card:#fff;--tx:#14263a;--mu:#5b6b7c;--bd:#d8e0e8;--pr:#0b4a7a;--ac:#c9a227;--ok:#2e7d4f;--rd:#b3402f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a26;--card:#172635;--tx:#e8eef4;--mu:#9bb0c3;--bd:#27405a;--pr:#5aa6dc}}
:root[data-theme="dark"]{--bg:#0e1a26;--card:#172635;--tx:#e8eef4;--mu:#9bb0c3;--bd:#27405a;--pr:#5aa6dc}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}
#panel{max-width:760px;margin:0 auto;padding:14px 14px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0}.top{background:linear-gradient(135deg,#002e5d,#0b4a7a);color:#fff;border-radius:14px;padding:12px 14px;border-bottom:4px solid var(--ac)}.top button{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)}.card.now{border-left-color:var(--ac);background:linear-gradient(90deg,rgba(201,162,39,.12),transparent 40%),var(--card)}button.pr{background:linear-gradient(135deg,#0b4a7a,#002e5d)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--card);padding:10px 14px;border-radius:10px;cursor:pointer;min-height:44px}
button.on,button.pr{background:var(--pr);color:#fff;border-color:var(--pr)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.rd{color:var(--rd)}
button.big{width:100%;font-size:20px;padding:16px;margin:10px 0}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);min-height:44px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
.it{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}.it .n{flex:1}.it b{display:block}.it small{color:var(--mu)}
.it button{padding:8px 10px;min-height:40px}
.now{border-left:5px solid var(--ac)}
.th{display:flex;gap:6px;flex-wrap:wrap}.th div{position:relative}.th img{height:64px;border-radius:8px}
.th button{position:absolute;top:2px;right:2px;min-height:24px;padding:0 7px;font-size:12px}
.hint{font-size:13px;color:var(--mu)}
/* PANTALLA */
#disp{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% -20%,#0f5a94,#032a4d 60%,#021a33);color:#fff;display:none}#disp::before{content:"";position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 50% 0%,rgba(227,199,101,.08) 0 4deg,transparent 4deg 12deg);animation:rt 50s linear infinite alternate}@keyframes rt{to{transform:rotate(10deg) scale(1.15)}}
body.d #disp{display:block}body.d #panel{display:none}
#bg,#bg iframe,#bg video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
#bg .sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s,transform 9s;transform:scale(1.04)}
#bg .sl.a{opacity:1;transform:scale(1.12)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,36,58,.78),rgba(6,36,58,.45) 40%,rgba(6,36,58,.85))}
#disp header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:2.2vh 3vw;border-bottom:2px solid #c9a227;background:linear-gradient(180deg,rgba(2,26,51,.92),rgba(2,26,51,.55))}
#disp .ut{font-family:Georgia,serif;font-size:3.4vh;letter-spacing:.04em}
#disp .ut small{display:block;font:1.8vh system-ui;letter-spacing:.2em;text-transform:uppercase;color:#e3c765}
#clock{font:300 7vh Georgia,serif}
#disp main{position:absolute;top:14vh;bottom:15vh;left:3vw;right:3vw;display:grid;grid-template-columns:1.5fr 1fr;gap:3vw}
.pane{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);border-radius:2vh;padding:3vh 2.5vw}
#now{display:flex;flex-direction:column;justify-content:center;text-align:center;border-top:.7vh solid #c9a227}
#now .lb{font-size:2.2vh;letter-spacing:.3em;text-transform:uppercase;color:#e3c765}
#now .nm{font:clamp(30px,9vh,110px)/1.1 Georgia,serif;margin:2vh 0}
#now .tp{font-size:3vh;opacity:.9}#now .of{margin-top:3vh;font-size:3.4vh;color:#e3c765}
#now.fl{animation:fl 1.1s ease-out 3}
@keyframes fl{0%{box-shadow:0 0 0 0 rgba(227,199,101,.9)}100%{box-shadow:0 0 0 5vh rgba(227,199,101,0)}}
#now .nm.in{animation:in .9s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(5vh) scale(.94)}to{opacity:1;transform:none}}
#wait h2{margin:0 0 2vh;font-size:3vh;color:#e3c765;letter-spacing:.1em;text-transform:uppercase}
#wait .w{display:flex;gap:1.2vw;align-items:center;padding:1.6vh 0;border-bottom:1px solid rgba(255,255,255,.18);font-size:3vh;animation:in .7s both}
#wait .w i{font:normal 2.6vh Georgia,serif;background:#c9a227;color:#06243a;width:5vh;height:5vh;border-radius:50%;display:grid;place-items:center;flex:none}
#wait .w small{display:block;font-size:1.9vh;opacity:.75}
#disp footer{position:absolute;bottom:0;left:0;right:0;height:11vh;background:rgba(6,36,58,.88);display:flex;align-items:center;gap:2.5vw;padding:0 3vw;font-size:3vh;border-top:2px solid #c9a227}
#tk{flex:1;overflow:hidden;white-space:nowrap;font-style:italic;opacity:.95}
#tk span{display:inline-block;padding-left:100%;animation:mq 28s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
#flogo{position:absolute;height:11vh;max-width:18vw;object-fit:contain;filter:drop-shadow(0 .5vh 1.5vh rgba(0,0,0,.5));animation:fx 38s linear infinite alternate,fy 23s linear infinite alternate;display:none}
@keyframes fx{from{left:2vw}to{left:calc(100vw - 20vw)}}@keyframes fy{from{top:16vh}to{top:calc(100vh - 28vh)}}
#snd{position:absolute;right:2vw;bottom:13vh;opacity:.7;font-size:14px}
@media(max-aspect-ratio:1/1){#disp main{grid-template-columns:1fr;grid-template-rows:1.2fr 1fr}#clock{font-size:5vh}}
</style></head><body>
<div id="panel"></div>
<div id="disp">
 <div id="bg"></div><div class="shade"></div>
 <header><div class="ut serif"><span id="dn"></span><small id="du"></small></div><div id="clock"></div></header>
 <main><section class="pane" id="now"></section><aside class="pane" id="wait"></aside></main>
 <footer><div id="fe"></div><div id="cl"></div><div id="tk"><span id="tks"></span></div></footer>
 <img id="flogo" alt=""><button id="snd">🔔 Activar sonido</button>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TIPOS={Barrio:["Recomendación para el templo","Entrevista con el obispo","Llamamiento / relevo","Entrevista de ministración","Preparación misional","Declaración de ajuste de diezmos","Otra"],Estaca:["Recomendación para el templo","Entrevista con el presidente de estaca","Llamamiento / relevo","Entrevista con el sumo consejo","Preparación misional","Declaración de ajuste de diezmos","Otra"]};
const CARGOS={Barrio:["Obispo","1er. Consejero del Obispado","2.º Consejero del Obispado","Presidente del Cuórum de Élderes","Presidenta de la Sociedad de Socorro"],Estaca:["Presidente de Estaca","1er. Consejero de la Estaca","2.º Consejero de la Estaca","Patriarca de la estaca","Presidente del Cuórum de Élderes","Presidenta de la Sociedad de Socorro"]};function addEnt(t){if(!t)return;S.cfg.ents.push({n:"",t:t==="Otro cargo"?"Nuevo cargo":t,of:"Oficina"});save()}
const ENTS={Barrio:[{n:"",t:"Obispo",of:"Oficina del Obispo"},{n:"",t:"1er. Consejero del Obispado",of:"Oficina del Obispo"},{n:"",t:"2.º Consejero del Obispado",of:"Oficina del Obispo"},{t:"Presidente del Cuórum de Élderes",of:"Salón del Cuórum de Élderes"},{t:"Presidenta de la Sociedad de Socorro",of:"Salón de la Sociedad de Socorro"}],Estaca:[{n:"",t:"Presidente de Estaca",of:"Oficina del Presidente de Estaca"},{n:"",t:"1er. Consejero de la Estaca",of:"Oficina del Presidente de Estaca"},{n:"",t:"2.º Consejero de la Estaca",of:"Oficina del Presidente de Estaca"},{t:"Presidente del Cuórum de Élderes",of:"Salón 2"},{t:"Presidenta de la Sociedad de Socorro",of:"Salón 3"},{t:"Patriarca de la estaca",of:"Oficina del Patriarca"}]};
let S={cfg:{unit:"Barrio",nombre:"Nombre del barrio",ents:ENTS.Barrio.map(x=>({...x})),priv:"inicial",showTipo:false,logo:"",bgType:"carrusel",video:"",photos:[],temp:"",clima:"☀️",aviso:"Bienvenidos. Por favor aguarde su turno con reverencia.",secs:8},q:[],call:null,n:1};
let sndOn=false,flt=-1,tab="cola",db=null,ref=null,assets=null,isD=false,lastTs=0,bgKey="",slide=0,slT=null;
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
let bc=null;try{bc=new BroadcastChannel("sud-turnos")}catch(e){}
function merge(d){if(d&&d.cfg){S=Object.assign({q:[],call:null,n:1},d);if(!S.cfg.ents)S.cfg.ents=ENTS[S.cfg.unit||"Barrio"].map(x=>({...x}));render()}}
function save(){render();const j=JSON.stringify(S);ls("sud",j);try{bc&&bc.postMessage(j)}catch(e){}
 if(ref)ref.set(JSON.parse(j)).catch(()=>{})}
if(bc)bc.onmessage=e=>{try{merge(JSON.parse(e.data))}catch(x){}};
try{const o=ls("sud");if(o)merge(JSON.parse(o))}catch(e){}
(async()=>{try{const c=window.claude&&await claude.use("db");if(c){db=c;ref=c.doc("sud/main");
 ref.onSnapshot(s=>{if(s.exists)merge(s.data());else if(!isD)save()},()=>{})}
 assets=window.claude?await claude.use("assets"):null;render()}catch(e){}})();
/* ---------- acciones ---------- */
const C=()=>S.cfg,EN=i=>S.cfg.ents[i]||S.cfg.ents[0],EL=e=>(e.n?e.n+" — ":"")+e.t,DN=p=>{const m=C().priv||"inicial",w=String(p.nom||"").trim().split(/\s+/);if(m==="turno")return"Turno "+p.id;if(m==="completo"||w.length<2)return w.join(" ");return w[0]+" "+w[1][0].toUpperCase()+"."},HN=p=>DN(p);
function add(){const nom=$("#fn").value.trim();if(!nom)return;S.q.push({id:S.n++,nom,tipo:$("#ft").value,e:+$("#fi").value,st:"w"});save()}
function llamar(id){const p=S.q.find(x=>x.id===id);if(!p)return;S.q.forEach(x=>{if(x.st==="c"&&(x.e||0)===(p.e||0)&&x.id!==p.id)x.st="d"});p.st="c";
 const en=EN(p.e);S.call={id:p.id,nom:p.nom,tipo:p.tipo,tr:p.tr,ent:EL(en),of:en.of,ts:Date.now()};save()}
function sig(){const p=S.q.find(x=>x.st==="w"&&!EN(x.e).pausa&&(flt<0||(x.e||0)===flt));if(p)llamar(p.id)}
function fin(id){const p=S.q.find(x=>x.id===id);if(p)p.st="d";if(S.call&&S.call.id===id)S.call=Object.assign({},S.call,{done:1});save()}
function del(id){S.q=S.q.filter(x=>x.id!==id);if(S.call&&S.call.id===id)S.call=null;save()}
function mov(id,d){const w=S.q.filter(x=>x.st==="w"),i=w.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=w.length)return;
 const a=S.q.indexOf(w[i]),b=S.q.indexOf(w[j]);[S.q[a],S.q[b]]=[S.q[b],S.q[a]];save()}
function limpiar(){if(confirm("¿Vaciar toda la lista?")){S.q=[];S.call=null;S.n=1;save()}}
function cfg(k,v){S.cfg[k]=v;if(k==="unit")S.cfg.ents=ENTS[v].map(x=>({...x}));save()}
async function up(files,kind){if(!assets){alert("La subida de imágenes no está disponible en esta vista.");return}
 for(const f of files){try{const r=await assets.upload(f);if(kind==="logo")S.cfg.logo=r.url;else S.cfg.photos.push(r.url)}catch(e){alert("No se pudo subir "+f.name)}}save()}
/* ---------- panel ---------- */
function panel(){
 const c=C(),w=S.q.filter(x=>x.st==="w"&&(flt<0||(x.e||0)===flt)),cs=S.q.filter(x=>x.st==="c"),d=S.q.filter(x=>x.st==="d");
 let h=`<div class="top">${c.logo?`<img src="${esc(c.logo)}" alt="" style="height:40px;max-width:90px;object-fit:contain">`:""}<h1 class="serif" style="flex:1">${esc(c.nombre)}<small style="display:block;font:12px system-ui;letter-spacing:.15em;text-transform:uppercase;color:#e3c765">🎛️ Panel del líder · ${esc(c.unit)}</small></h1><button onclick="location.hash='#pantalla';location.reload()">📺 Abrir pantalla</button></div>
 <div class="tabs"><button class="${tab==="cola"?"on":""}" onclick="tab='cola';render()">📋 Lista</button><button class="${tab==="cfg"?"on":""}" onclick="tab='cfg';render()">⚙️ Pantalla y ajustes</button></div>`;
 if(tab==="cola"){
  h+=`<div class="th" style="margin-bottom:8px"><button class="${flt<0?"on":""}" onclick="flt=-1;render()">Todos</button>${c.ents.map((e,i)=>`<button class="${flt===i?"on":""}" onclick="flt=${i};render()">${e.pausa?"⏸ ":""}${esc(e.n||e.t)}</button>`).join("")}</div>${flt>=0?`<button class="${EN(flt).pausa?"ok":""}" style="margin-bottom:8px" onclick="S.cfg.ents[${flt}].pausa=!S.cfg.ents[${flt}].pausa;save()">${EN(flt).pausa?"▶ Reanudar entrevistas":"⏸ Marcar en receso"}</button>`:""}${cs.map(p=>`<div class="card now"><div class="hint">🚪 En entrevista · ${esc(EL(EN(p.e)))}</div><h2 style="margin:4px 0">${esc(p.nom)}</h2><div class="hint">${esc(p.tipo)}</div><div class="row" style="margin-top:10px"><button class="ok" onclick="fin(${p.id})">✔ Atendido</button><button onclick="llamar(${p.id})">🔔 Repetir</button></div></div>`).join("")}
  
  <button class="pr big" onclick="sig()" ${w.length?"":"disabled"}>▶ Llamar siguiente${w[0]?" — "+esc(w[0].nom):""}</button>
  <div class="card"><label>Agregar a la lista</label><input id="fn" placeholder="Nombre del hermano o hermana" onkeydown="if(event.key==='Enter')add()"><select id="fi" style="margin-top:8px">${c.ents.map((e,i)=>`<option value="${i}" ${flt===i?"selected":""}>${esc(EL(e))}</option>`).join("")}</select>
  <div class="row" style="margin-top:8px"><select id="ft">${TIPOS[c.unit].map(t=>`<option>${esc(t)}</option>`).join("")}</select><button class="pr" onclick="add()">Agregar</button></div></div>
  <div class="card"><b>⏳ En espera (${w.length})</b>${w.map((p,i)=>`<div class="it"><div class="n"><b>${i+1}. ${esc(p.nom)}</b><small>Turno ${p.id} · ${esc(EL(EN(p.e)))} · ${esc(p.tipo)}</small></div><button onclick="llamar(${p.id})">Llamar</button><button onclick="mov(${p.id},-1)">↑</button><button onclick="mov(${p.id},1)">↓</button><button class="rd" onclick="del(${p.id})">✕</button></div>`).join("")||`<div class="hint">La lista está vacía.</div>`}</div>
  ${d.length?`<div class="card"><b>✅ Atendidos (${d.length})</b>${d.map(p=>`<div class="it"><div class="n"><b>${esc(p.nom)}</b><small>${esc(p.tipo)}</small></div><button class="rd" onclick="del(${p.id})">✕</button></div>`).join("")}<button class="rd" style="margin-top:8px" onclick="limpiar()">Vaciar lista completa</button></div>`:""}`;
 }else{
  h+=`<div class="card"><label>Nivel</label><div class="row"><button class="${c.unit==="Barrio"?"on":""}" onclick="cfg('unit','Barrio')">Barrio</button><button class="${c.unit==="Estaca"?"on":""}" onclick="cfg('unit','Estaca')">Estaca</button></div>
  <label>Nombre del barrio / estaca</label><input value="${esc(c.nombre)}" onchange="cfg('nombre',this.value)">
  <label>👥 Quienes entrevistan y su oficina o salón</label>${c.ents.map((e,i)=>`<div style="border-bottom:1px solid var(--bd);padding:8px 0"><div class="row" style="margin-bottom:6px"><input placeholder="Nombre (ej. Edwin Meneses)" value="${esc(e.n||"")}" onchange="S.cfg.ents[${i}].n=this.value;save()"><input placeholder="Cargo (ej. Presidente Estaca Trinidad)" value="${esc(e.t)}" onchange="S.cfg.ents[${i}].t=this.value;save()"></div><div class="row"><input placeholder="Oficina o salón" value="${esc(e.of)}" onchange="S.cfg.ents[${i}].of=this.value;save()"><button class="rd" onclick="S.cfg.ents.length>1&&S.cfg.ents.splice(${i},1);save()">✕</button></div></div>`).join("")}<select onchange="addEnt(this.value);this.value=''"><option value="">+ Agregar entrevistador…</option>${CARGOS[c.unit].map(t=>`<option>${esc(t)}</option>`).join("")}<option>Otro cargo</option></select>
  
  <label>Mensaje inferior</label><input value="${esc(c.aviso)}" onchange="cfg('aviso',this.value)"></div>
  <div class="card"><b>🔒 Privacidad en la pantalla</b><label>Cómo se muestra a cada persona</label><select onchange="cfg('priv',this.value)"><option value="inicial" ${(c.priv||"inicial")==="inicial"?"selected":""}>Nombre e inicial del apellido (Fernando R.)</option><option value="turno" ${c.priv==="turno"?"selected":""}>Número de turno (Turno 7)</option><option value="completo" ${c.priv==="completo"?"selected":""}>Nombre completo</option></select><label>Propósito de la entrevista</label><select onchange="cfg('showTipo',this.value==='1')"><option value="0" ${c.showTipo?"":"selected"}>No mostrar en la pantalla</option><option value="1" ${c.showTipo?"selected":""}>Mostrar en la pantalla</option></select><p class="hint">El panel del líder siempre muestra el nombre completo, el propósito y el número de turno.</p></div><div class="card"><b>🔊 Voz y jornada</b><label>Anuncio por voz al llamar</label><select onchange="cfg('voz',this.value==='1')"><option value="1" ${c.voz===false?"":"selected"}>Activado</option><option value="0" ${c.voz===false?"selected":""}>Desactivado</option></select><label>Borrar la lista automáticamente a las</label><input type="time" value="${esc(c.cierre||"")}" onchange="cfg('cierre',this.value)"><p class="hint">Déjelo vacío para no borrar. Al borrar, la numeración de turnos vuelve a 1. Para el anuncio por voz, toque “Activar sonido” en la pantalla.</p></div><div class="card"><b>🖼️ Fondo de la pantalla</b><label>Tipo</label><select onchange="cfg('bgType',this.value)">
  <option value="carrusel" ${c.bgType==="carrusel"?"selected":""}>Carrusel de fotos</option><option value="video" ${c.bgType==="video"?"selected":""}>Video (YouTube / Facebook / TikTok)</option><option value="color" ${c.bgType==="color"?"selected":""}>Color sólido</option></select>
  <label>Enlace del video</label><input value="${esc(c.video)}" placeholder="https://www.youtube.com/watch?v=…" onchange="cfg('video',this.value.trim())">
  <p class="hint">Si el video no se muestra, el sitio de origen puede impedir su inserción; use el carrusel.</p>
  <label>Fotos del carrusel</label><input type="file" accept="image/*" multiple onchange="up(this.files,'f')">
  <div class="th" style="margin-top:8px">${c.photos.map((u,i)=>`<div><img src="${esc(u)}" alt=""><button onclick="S.cfg.photos.splice(${i},1);save()">✕</button></div>`).join("")}</div>
  <label>Segundos por foto</label><input type="number" min="3" max="60" value="${c.secs}" onchange="cfg('secs',+this.value||8)"></div>
  <div class="card"><b>🏷️ Logotipo flotante</b><input type="file" accept="image/*" onchange="up(this.files,'logo')" style="margin-top:8px">${c.logo?`<div class="th" style="margin-top:8px"><div><img src="${esc(c.logo)}" alt=""><button onclick="cfg('logo','')">✕</button></div></div>`:""}</div>
  <div class="card"><b>🌤️ Clima</b><p class="hint">Se ingresa a mano: la pantalla no puede consultar servicios externos.</p><div class="row"><select onchange="cfg('clima',this.value)">${["☀️","⛅","☁️","🌧️","⛈️","🌫️"].map(e=>`<option ${c.clima===e?"selected":""}>${e}</option>`).join("")}</select><input value="${esc(c.temp)}" placeholder="Ej. 31°C" onchange="cfg('temp',this.value)"></div></div>`;
 }
 const k=document.activeElement&&document.activeElement.id==="fn";$("#panel").innerHTML=h;if(k)$("#fn").focus()}
/* ---------- pantalla ---------- */
function vid(u){let m;if(m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/))return`https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1&controls=0&loop=1&playlist=${m[1]}&playsinline=1`;
 if(/facebook\.com|fb\.watch/.test(u))return`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(u)}&show_text=false&autoplay=true&mute=1`;
 if(m=u.match(/tiktok\.com\/.*video\/(\d+)/))return`https://www.tiktok.com/embed/v2/${m[1]}`;return u}
function bg(){const c=C(),k=[c.bgType,c.video,c.photos.join(),c.secs].join("|");if(k===bgKey)return;bgKey=k;clearInterval(slT);const b=$("#bg");b.innerHTML="";
 if(c.bgType==="video"&&c.video){b.innerHTML=`<iframe src="${esc(vid(c.video))}" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="no-referrer"></iframe>`}
 else if(c.bgType==="carrusel"&&c.photos.length){b.innerHTML=c.photos.map(u=>`<div class="sl" style="background-image:url('${esc(u)}')"></div>`).join("");slide=0;const s=b.children;s[0].classList.add("a");
  if(s.length>1)slT=setInterval(()=>{s[slide].classList.remove("a");slide=(slide+1)%s.length;s[slide].classList.add("a")},(c.secs||8)*1000)}}
function say(t){if(!sndOn||C().voz===false||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="es-419";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function chime(){try{const x=new(window.AudioContext||window.webkitAudioContext)();[659,880,1175].forEach((f,i)=>{const o=x.createOscillator(),g=x.createGain();o.frequency.value=f;o.connect(g);g.connect(x.destination);const t=x.currentTime+i*.28;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.9);o.start(t);o.stop(t+1)})}catch(e){}}
function disp(){const c=C(),w=S.q.filter(x=>x.st==="w").slice(0,6);bg();
 $("#dn").textContent=c.nombre;$("#du").textContent="📺 "+(c.unit==="Barrio"?"Barrio":"Estaca")+" · Entrevistas";
 $("#cl").textContent=(c.clima||"")+" "+(c.temp||"");$("#tks").textContent=c.aviso||"";
 const L=$("#flogo");if(c.logo){L.src=c.logo;L.style.display="block"}else L.style.display="none";
 const n=$("#now"),cl=S.call;
 if(cl&&!cl.done){n.innerHTML=`<div class="lb">🔔 Pase a su entrevista</div><div class="nm">${esc(HN(cl))}</div><div class="tp">Con <b>${esc(cl.ent||"")}</b>${c.showTipo?"<br>"+esc(cl.tipo):""}</div><div class="of">➜ ${esc(cl.of||"")}</div>`;
  if(cl.ts!==lastTs){lastTs=cl.ts;n.classList.remove("fl");void n.offsetWidth;n.classList.add("fl");n.querySelector(".nm").classList.add("in");if(Date.now()-cl.ts<15000){chime();setTimeout(()=>say("Pase a su entrevista, "+HN(cl)+". Con "+(cl.ent||"su entrevistador").replace(" — ",", ")+". "+(cl.of||"")+"."),1100)}}}
 else{lastTs=cl?cl.ts:0;n.classList.remove("fl");n.innerHTML=`<div class="lb">📋 Entrevistas</div><div class="nm" style="font-size:6vh">⏳ Aguarde su turno</div><div class="tp">Será llamado en breve</div>`}
 const oc=S.q.filter(x=>x.st==="c"&&!(cl&&!cl.done&&x.id===cl.id));const pz=c.ents.filter(e=>e.pausa);$("#wait").innerHTML=(pz.length?`<div style="font-size:2.2vh;color:#e3c765;margin-bottom:1.5vh">⏸ En receso: ${esc(pz.map(e=>EL(e)).join(" · "))}</div>`:"")+(oc.length?`<h2>🚪 En entrevista</h2>`+oc.map(p=>`<div class="w"><i>➜</i><div>${esc(DN(p))}<small>${esc(EL(EN(p.e)))} · ${esc(EN(p.e).of)}</small></div></div>`).join(""):"")+`<h2 style="margin-top:2vh">⏳ En espera</h2>`+(w.map((p,i)=>`<div class="w" style="animation-delay:${i*.08}s"><i>${i+1}</i><div>${esc(DN(p))}<small>${esc(EL(EN(p.e)))}${c.showTipo?" · "+esc(p.tipo):""}</small></div></div>`).join("")||`<div style="opacity:.7;font-size:2.6vh">No hay personas en espera</div>`)}
function tick(){const d=new Date();const cz=C().cierre,hy=d.toLocaleDateString("sv");if(cz&&d.toTimeString().slice(0,5)>=cz&&S.lastClear!==hy){S.q=[];S.call=null;S.n=1;S.lastClear=hy;save()}$("#clock").textContent=d.toLocaleTimeString("es-BO",{hour:"2-digit",minute:"2-digit"});
 const f=d.toLocaleDateString("es-BO",{weekday:"long",day:"numeric",month:"long",year:"numeric"});$("#fe").textContent=f.charAt(0).toUpperCase()+f.slice(1)}
function render(){isD=location.hash==="#pantalla";document.title=isD?"📺 Pantalla · Turnos":"🎛️ Panel · Turnos";try{let l=document.querySelector("link[rel=icon]");if(!l){l=document.createElement("link");l.rel="icon";document.head.appendChild(l)}l.href="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>"+(isD?"📺":"🎛️")+"</text></svg>")}catch(e){}document.body.classList.toggle("d",isD);isD?disp():panel()}
$("#snd").onclick=()=>{sndOn=true;try{speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(e){}chime();$("#snd").style.display="none";try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}};
window.addEventListener("hashchange",()=>{bgKey="";render()});
setInterval(tick,1000);tick();render();
</script></body></html>
